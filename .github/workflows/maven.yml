name: Cucumber-Product-Tests
on: [push]

jobs:
  build_test:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 22
      uses: actions/setup-java@v3
      with:
        java-version: '22'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn test
    - name: HTML Preview
      id: html_preview
      uses: pavi2410/html-preview-action@v2
      with:
         html_file: 'extent.html'
